<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  #view { width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    color: #e9e4d8; text-align: center; cursor: pointer; user-select: none; transition: opacity .6s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #msg { font-size: clamp(15px, 1.6vw, 22px); letter-spacing: .04em; }
  #help { font-size: clamp(11px, 1vw, 14px); color: #8f8a80; }
  #bar { width: min(40%, 360px); height: 2px; background: #2a2724; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0; background: #d9c9a8; transition: width .2s; }
  #toast { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); color: #e9e4d8; font-size: 14px; background: rgba(0,0,0,.45);
    padding: 6px 12px; border-radius: 4px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>

<div id="stage">
  <canvas id="view" width="1920" height="1080"></canvas>
  <div id="overlay"><div id="msg">그림을 그리는 중…</div><div id="bar"><i></i></div><div id="help">Space 재생/일시정지 · ← → 5초 이동 · M 소리 · R 처음부터 · F 전체화면</div></div>
